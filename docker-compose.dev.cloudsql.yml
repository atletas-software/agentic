# Local Docker dev + Cloud SQL (hot reload, no local Postgres).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.dev.cloudsql.yml --profile cloudsql up -d --build
#
# Or: make run-dev-cloudsql
#
# Repo-root .env must set CLOUD_SQL_CONNECTION_NAME, CLOUDSQL_USER, CLOUDSQL_PASSWORD, CLOUDSQL_DATABASE.

services:
  api:
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${CLOUDSQL_USER}:${CLOUDSQL_PASSWORD}@cloud-sql-proxy:5432/${CLOUDSQL_DATABASE}

  worker:
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${CLOUDSQL_USER}:${CLOUDSQL_PASSWORD}@cloud-sql-proxy:5432/${CLOUDSQL_DATABASE}

  # Local Mac: gcloud ADC or credentials JSON (not VM metadata).
  cloud-sql-proxy:
    volumes:
      - ${CLOUDSQL_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/cloudsql-credentials.json:ro
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--credentials-file=/run/secrets/cloudsql-credentials.json"
      - "${CLOUD_SQL_CONNECTION_NAME}"
