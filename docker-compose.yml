# Platform stack: api + worker + redis. Review UI and YOLO feedback run on api/worker (:8000).
name: athlete-agent
#
# Application secrets: app/backendapi/.env
# Compose interpolation (repo-root .env): ports, Sheets JSON, Cloud SQL, YOLO weight paths.
#
# Local Docker with YOLO + Postgres hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# GCP VM production:
#   docker compose up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.cloudsql.yml --profile cloudsql up -d --build
#
# Optional legacy standalone feedback agent (:5055):
#   docker compose --profile feedback-agent up -d --build

x-yolo-environment: &yolo-environment
  YOLO_HIGHLIGHT_WEIGHTS: /app/app/agents/feedback/models/highlight_yolo_v1.pt
  YOLO_POSE_DEVICE: ${YOLO_POSE_DEVICE:-cpu}
  YOLO_POSE_WEIGHTS: ${YOLO_POSE_WEIGHTS:-yolov8n-pose.pt}
  VIDEO_HIGHLIGHT_DETECTOR: yolo
  POSE_PIPELINE_OUTPUT_DIR: /app/data/pose
  FEEDBACK_USE_POSE_PIPELINE: ${FEEDBACK_USE_POSE_PIPELINE:-false}

services:
  api:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: athlete-agent-api
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
      <<: *yolo-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
      - feedback_data:/app/data
      - ./app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:/app/app/agents/feedback/models/highlight_yolo_v1.pt:ro
      - ./app/yolo_model/artifacts/pose:/app/app/yolo_model/artifacts/pose
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
        required: false
    command:
      - sh
      - -c
      - unset GOOGLE_APPLICATION_CREDENTIALS; exec uvicorn backendapi.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: athlete-agent-worker
    command: ["sh", "-c", "unset GOOGLE_APPLICATION_CREDENTIALS; exec python -m backendapi.workers.run_worker"]
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
      POSE_PIPELINE_REMOTE_ONLY: ${POSE_PIPELINE_REMOTE_ONLY:-true}
      <<: *yolo-environment
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
      - feedback_data:/app/data
      - ./app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:/app/app/agents/feedback/models/highlight_yolo_v1.pt:ro
      - ./app/yolo_model/artifacts/pose:/app/app/yolo_model/artifacts/pose
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
        required: false
    init: true
    restart: unless-stopped

  # Legacy standalone feedback agent
  feedback-agent:
    profiles: ["feedback-agent"]
    build:
      context: .
      dockerfile: app/agents/feedback/Dockerfile
    container_name: athlete-agent-feedback
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app
      YOLO_POSE_DEVICE: cpu
      YOLO_POSE_WEIGHTS: yolov8n-pose.pt
      YOLO_HIGHLIGHT_WEIGHTS: /app/agents/feedback/models/highlight_yolo_v1.pt
      VIDEO_HIGHLIGHT_DETECTOR: yolo
      FEEDBACK_USE_POSE_PIPELINE: "false"
      POSE_PIPELINE_OUTPUT_DIR: /app/data/pose
    ports:
      - "${FEEDBACK_AGENT_PORT:-5055}:5055"
    volumes:
      - feedback_agent_data:/app/data
      - ./app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:/app/agents/feedback/models/highlight_yolo_v1.pt:ro
    command: ["uvicorn", "agents.feedback.main:app", "--host", "0.0.0.0", "--port", "5055"]
    init: true
    restart: unless-stopped

  # Optional local GPU/CPU pose API (RunPod uses the same image remotely). Profile: pose-api
  pose-api:
    profiles: ["pose-api"]
    build:
      context: .
      dockerfile: app/pose_api/Dockerfile
    container_name: athlete-agent-pose-api
    environment:
      PYTHONPATH: /app
      YOLO_POSE_DEVICE: ${YOLO_POSE_DEVICE:-cpu}
      YOLO_HIGHLIGHT_WEIGHTS: /app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt
      DATA_DIR: /app/data/pose_api
    ports:
      - "${POSE_API_PORT:-5060}:5060"
    volumes:
      - pose_api_data:/app/data
      - ./app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:/app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: athlete-agent-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloud-sql-proxy:
    profiles: ["cloudsql"]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
    container_name: athlete-agent-cloud-sql-proxy
    # Image ENTRYPOINT is /cloud-sql-proxy — pass flags only (do not use sh -c here).
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    restart: unless-stopped

volumes:
  feedback_data:
  feedback_agent_data:
  pose_api_data:
