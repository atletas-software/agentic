# Compose reads repo-root `.env` for ${POSTGRES_PASSWORD} etc.
# API/worker load `app/.env` inside containers; runtime URLs below override hostnames for in-cluster networking.
services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sheet-mcp-api
    env_file:
      - app/.env
    environment:
      # Force container-network defaults unless explicitly overridden.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-athlete}}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      DESTINATION_GOOGLE_CREDENTIALS_FILE: ${DESTINATION_GOOGLE_CREDENTIALS_FILE_DOCKER:-/run/secrets/google-credentials.json}
      FEEDBACK_AGENT_BASE_URL: ${FEEDBACK_AGENT_BASE_URL_DOCKER:-http://feedback-agent:5055}
      # Set DEV_HOT_RELOAD=0 in root .env for production (multi-worker, no auto-reload).
      DEV_HOT_RELOAD: ${DEV_HOT_RELOAD:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    command:
      - sh
      - -c
      - |
          set -e
          if [ "$${DEV_HOT_RELOAD:-0}" = "1" ]; then
            exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
          else
            exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}
          fi
    ports:
      - "8000:8000"
    volumes:
      # Live code + static files from host (no image rebuild on edit). Matches Dockerfile WORKDIR /app.
      - .:/app
      # Keep Google service-account credentials outside image layers.
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sheet-mcp-worker
    command: ["python", "-m", "app.workers.run_worker"]
    env_file:
      - app/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-athlete}}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      DESTINATION_GOOGLE_CREDENTIALS_FILE: ${DESTINATION_GOOGLE_CREDENTIALS_FILE_DOCKER:-/run/secrets/google-credentials.json}
      FEEDBACK_AGENT_BASE_URL: ${FEEDBACK_AGENT_BASE_URL_DOCKER:-http://feedback-agent:5055}
    volumes:
      # Code from host; RQ still loads Python at process start — run `docker compose restart worker` after worker code edits.
      - .:/app
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      feedback-agent:
        condition: service_started
    init: true
    restart: unless-stopped

  feedback-agent:
    build:
      context: .
      dockerfile: agents/feedback/Dockerfile
    container_name: sheet-mcp-feedback-agent
    env_file:
      - agents/.env
    environment:
      PORT: 5055
      DEV_HOT_RELOAD: ${DEV_HOT_RELOAD:-1}
      # Public URL users click for share/review links (must be reachable from a browser).
      # Same-server deploy default: http://<server-host>:5055. Override via root .env: PUBLIC_BASE_URL=...
      # Leave empty only for local dev where the agent is on 127.0.0.1.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    command:
      - sh
      - -c
      - |
          set -e
          if [ "$${DEV_HOT_RELOAD:-0}" = "1" ]; then
            exec uvicorn agents.feedback.main:app --host 0.0.0.0 --port $${PORT:-5055} --reload
          else
            exec uvicorn agents.feedback.main:app --host 0.0.0.0 --port $${PORT:-5055}
          fi
    ports:
      - "5055:5055"
    volumes:
      - .:/app
      - feedback_agent_data:/app/data
    init: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sheet-mcp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sheet-mcp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: ${POSTGRES_DB:-athlete}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-athlete}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  feedback_agent_data:
