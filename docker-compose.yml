# GCP VM production stack: api + worker + feedback-agent + redis.
#
# Application secrets and URLs: app/backendapi/.env, app/agents/.env
# Compose interpolation only (repo-root .env): ports, credential mount path, Cloud SQL proxy instance.
#
# Required in app/backendapi/.env for this stack:
#   DATABASE_URL=postgresql+psycopg://USER:PASS@cloud-sql-proxy:5432/DB   (with --profile cloudsql)
#     or postgresql+psycopg://USER:PASS@<private-ip>:5432/DB             (VM in same VPC)
#     Do NOT use localhost for DB/Redis inside containers.
#   DESTINATION_GOOGLE_CREDENTIALS_FILE=/run/secrets/google-credentials.json  (if using a JSON key file)
#
# Compose overrides below win over app/backendapi/.env for Docker network hostnames only.
#
# Optional Cloud SQL Auth Proxy (no authorized-network IP whitelist):
#   CLOUD_SQL_CONNECTION_NAME=project:region:instance  in repo-root .env
#   docker compose --profile cloudsql up -d --build

services:
  api:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: sheet-mcp-api
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      FEEDBACK_AGENT_BASE_URL: http://feedback-agent:5055
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
        required: false
    command:
      - sh
      - -c
      - exec uvicorn backendapi.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: sheet-mcp-worker
    command: ["python", "-m", "backendapi.workers.run_worker"]
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      FEEDBACK_AGENT_BASE_URL: http://feedback-agent:5055
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      feedback-agent:
        condition: service_started
      cloud-sql-proxy:
        condition: service_started
        required: false
    init: true
    restart: unless-stopped

  feedback-agent:
    build:
      context: .
      dockerfile: app/agents/feedback/Dockerfile
    container_name: sheet-mcp-feedback-agent
    env_file:
      - app/agents/.env
    environment:
      PYTHONPATH: /app/app
    ports:
      - "${FEEDBACK_AGENT_PORT:-5055}:5055"
    volumes:
      - feedback_agent_data:/app/data
    command: ["uvicorn", "agents.feedback.main:app", "--host", "0.0.0.0", "--port", "5055"]
    init: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sheet-mcp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloud-sql-proxy:
    profiles: ["cloudsql"]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
    container_name: sheet-mcp-cloud-sql-proxy
    command:
      - /cloud-sql-proxy
      - --address=0.0.0.0
      - --port=5432
      - ${CLOUD_SQL_CONNECTION_NAME}
    restart: unless-stopped

volumes:
  feedback_agent_data:
