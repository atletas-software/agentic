# GCP VM production stack: api + worker + feedback-agent + redis.
name: athlete-agent
#
# Application secrets and URLs: app/backendapi/.env, app/agents/.env
# Compose interpolation only (repo-root .env): ports, Sheets JSON path, Cloud SQL vars.
#
# GCP VM (recommended):
#   - Firestore + Cloud SQL: VM service account via ADC (roles/datastore.user + roles/cloudsql.client).
#   - Google Sheets only: credentials.json mounted at /run/secrets/google-credentials.json.
#   - Do NOT set GOOGLE_APPLICATION_CREDENTIALS in app/backendapi/.env on the VM.
#   - Cloud SQL: docker-compose.cloudsql.yml + --profile cloudsql (see .env.example).
#
# Compose overrides below win over app/backendapi/.env for in-cluster hostnames only.
#
# Optional Cloud SQL Auth Proxy (no authorized-network IP whitelist):
#   CLOUD_SQL_CONNECTION_NAME=project:region:instance  in repo-root .env
#   docker compose --profile cloudsql up -d --build

services:
  api:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: athlete-agent-api
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      FEEDBACK_AGENT_BASE_URL: http://feedback-agent:5055
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Sheets API only — not used for Firestore or Cloud SQL (VM service account handles those).
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
        required: false
    command:
      - sh
      - -c
      - unset GOOGLE_APPLICATION_CREDENTIALS; exec uvicorn backendapi.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/backendapi/Dockerfile
    container_name: athlete-agent-worker
    command: ["sh", "-c", "unset GOOGLE_APPLICATION_CREDENTIALS; exec python -m backendapi.workers.run_worker"]
    env_file:
      - app/backendapi/.env
    environment:
      PYTHONPATH: /app/app
      REDIS_URL: redis://redis:6379/0
      FEEDBACK_AGENT_BASE_URL: http://feedback-agent:5055
      DESTINATION_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
      # Slim worker has no torch — YOLO runs in feedback-agent only.
      POSE_PIPELINE_REMOTE_ONLY: "true"
      FEEDBACK_USE_POSE_PIPELINE: "false"
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE_HOST:-./credentials.json}:/run/secrets/google-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      feedback-agent:
        condition: service_started
      cloud-sql-proxy:
        condition: service_started
        required: false
    init: true
    restart: unless-stopped

  feedback-agent:
    build:
      context: .
      dockerfile: app/agents/feedback/Dockerfile
    container_name: athlete-agent-feedback
    env_file:
      - app/backendapi/.env
      - app/agents/.env
    environment:
      PYTHONPATH: /app
      YOLO_POSE_DEVICE: cpu
      YOLO_POSE_WEIGHTS: yolov8n-pose.pt
      # Baked in feedback-agent image; do not point at empty /run/models unless file exists there.
      YOLO_HIGHLIGHT_WEIGHTS: /app/agents/feedback/models/highlight_yolo_v1.pt
      VIDEO_HIGHLIGHT_DETECTOR: yolo
      FEEDBACK_USE_POSE_PIPELINE: "false"
      POSE_PIPELINE_OUTPUT_DIR: /app/data/pose
    ports:
      - "${FEEDBACK_AGENT_PORT:-5055}:5055"
    volumes:
      - feedback_agent_data:/app/data
      # Weights from git checkout — no image rebuild needed when disk is tight on the VM.
      - ./app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt:/app/agents/feedback/models/highlight_yolo_v1.pt:ro
    command: ["uvicorn", "agents.feedback.main:app", "--host", "0.0.0.0", "--port", "5055"]
    init: true
    restart: unless-stopped

  # Optional local GPU/CPU pose API (RunPod uses the same image remotely). Profile: pose-api
  pose-api:
    profiles: ["pose-api"]
    build:
      context: .
      dockerfile: app/pose_api/Dockerfile
    container_name: athlete-agent-pose-api
    environment:
      PYTHONPATH: /app
      YOLO_POSE_DEVICE: ${YOLO_POSE_DEVICE:-cpu}
      YOLO_HIGHLIGHT_WEIGHTS: /app/yolo_model/artifacts/train/highlight_v1.1.0/weights/best.pt
      DATA_DIR: /app/data/pose_api
    ports:
      - "${POSE_API_PORT:-5060}:5060"
    volumes:
      - pose_api_data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: athlete-agent-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloud-sql-proxy:
    profiles: ["cloudsql"]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
    container_name: athlete-agent-cloud-sql-proxy
    # Authenticates with the GCE VM attached service account (metadata). No credentials.json.
    # Image ENTRYPOINT is already /cloud-sql-proxy — do not repeat it in command.
    command:
      - --address=0.0.0.0
      - --port=5432
      - ${CLOUD_SQL_CONNECTION_NAME}
    restart: unless-stopped

volumes:
  feedback_agent_data:
  pose_api_data:
