# Cloud SQL for production (GCP VM) or merged with docker-compose.dev.cloudsql.yml for local dev.
#
# GCP VM (attached service account — no JSON key for proxy or Firestore):
#   CLOUDSQL_USE_CREDENTIALS_FILE=0 in repo-root .env
#   make run-prod-cloudsql
#
# Local Mac: CLOUDSQL_USE_CREDENTIALS_FILE=1 + ADC or credentials.json
#   make run-dev-cloudsql
#
# Repo-root .env (URL-encode special characters in CLOUDSQL_PASSWORD):
#   CLOUD_SQL_CONNECTION_NAME=athletefocus-agents:region:instance
#   CLOUDSQL_USER=postgres
#   CLOUDSQL_PASSWORD=your-url-encoded-password
#   CLOUDSQL_DATABASE=postgres

x-gce-metadata: &gce-metadata
  extra_hosts:
    - "metadata.google.internal:169.254.169.254"

services:
  api:
    <<: *gce-metadata
    environment:
      DATABASE_URL: postgresql+psycopg://${CLOUDSQL_USER}:${CLOUDSQL_PASSWORD}@cloud-sql-proxy:5432/${CLOUDSQL_DATABASE}
    depends_on:
      cloud-sql-proxy:
        condition: service_started
        required: true

  worker:
    <<: *gce-metadata
    environment:
      DATABASE_URL: postgresql+psycopg://${CLOUDSQL_USER}:${CLOUDSQL_PASSWORD}@cloud-sql-proxy:5432/${CLOUDSQL_DATABASE}
    depends_on:
      cloud-sql-proxy:
        condition: service_started
        required: true

  cloud-sql-proxy:
    <<: *gce-metadata
    environment:
      CLOUDSQL_USE_CREDENTIALS_FILE: ${CLOUDSQL_USE_CREDENTIALS_FILE:-0}
